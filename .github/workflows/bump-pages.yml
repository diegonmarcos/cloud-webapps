name: bump-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.PAGES_BUMP_TOKEN }}
    steps:
      - name: Dispatch bump to diegonmarcos.github.io
        if: env.TOKEN != ''
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/diegonmarcos/diegonmarcos.github.io/dispatches \
            -d '{"event_type":"cloud-webapps-bump","client_payload":{"sha":"${{ github.sha }}"}}'
      - name: Skipped (no PAGES_BUMP_TOKEN)
        if: env.TOKEN == ''
        run: echo "PAGES_BUMP_TOKEN not set; Pages pin not bumped"
