name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: bash scripts/test.sh
      # drift guard: the vendored service data must equal cloud-u-containers (the sync workflow repairs drift)
      - run: node scripts/sync-fallback-services.mjs --check
